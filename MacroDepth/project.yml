# XcodeGen specification for MacroDepth.
# Generate the Xcode project with:  xcodegen generate
# The generated MacroDepth.xcodeproj is intentionally git-ignored.

name: MacroDepth

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Swift 6 migration readiness: full data-race checking as warnings.
    SWIFT_STRICT_CONCURRENCY: complete
    # Key path literals are only inferred as Sendable with this feature (SE-0418), which
    # Swift 6 mode turns on by default. #Predicate and SortDescriptor require it.
    SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  MacroDepth:
    type: application
    platform: iOS
    sources:
      - path: MacroDepth
    entitlements:
      path: MacroDepth/MacroDepth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_NAME: MacroDepth
        PRODUCT_BUNDLE_IDENTIFIER: $(MACRODEPTH_BUNDLE_IDENTIFIER)
        INFOPLIST_FILE: MacroDepth/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: YES
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - MacroDepthTests
      gatherCoverageData: true

  MacroDepthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MacroDepthTests
    dependencies:
      - target: MacroDepth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MACRODEPTH_BUNDLE_IDENTIFIER).tests
        GENERATE_INFOPLIST_FILE: YES
